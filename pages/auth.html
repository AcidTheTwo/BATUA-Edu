<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Log in &middot; BATUA-Edu</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,400..700&display=swap" rel="stylesheet">
  <script>
    try {
      if (JSON.parse(localStorage.getItem('batua_user') || 'null')) {
        window.location.replace('dashboard.html');
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-layout">
  <div class="auth-wrap">
    <div class="flex justify-center mb-6">
      <a href="index.html" class="brand">
        <div class="brand-icon">B</div>
        <span class="brand-text">BATUA<span>-Edu</span></span>
      </a>
    </div>

    <div class="card p-6">
      <h1 id="card-title" class="text-lg font-bold text-white">Log in to your account</h1>
      <p id="card-sub" class="text-xs text-slate-500 mt-1">Use your username or email and password.</p>

      <!-- Inline Error Banner -->
      <div id="err-box" class="sub-box text-xs text-loss mt-4" style="display:none; border:1px solid rgba(248,113,113,0.35);"></div>

      <!-- Login Form -->
      <form id="login-form" class="mt-5 space-y-3" onsubmit="handleLogin(event)">
        <input class="input" id="login-id" placeholder="Username or email" autocomplete="username" required>
        <input class="input" id="login-pw" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" id="login-btn" class="btn btn-primary btn-full">Log in</button>
      </form>

      <!-- Register Form -->
      <form id="reg-form" class="mt-5 space-y-3" style="display:none;" onsubmit="handleRegister(event)">
        <div class="grid grid-2 gap-3">
          <input class="input" id="first_name" placeholder="First name" required>
          <input class="input" id="middle_name" placeholder="Middle name (optional)">
        </div>
        <input class="input" id="last_name" placeholder="Last name" required>
        <input class="input" id="username" placeholder="Username (unique)" autocomplete="username" required>
        <input class="input" id="email" type="email" placeholder="Email address" autocomplete="email" required>
        <input class="input" id="password" type="password" placeholder="Password (min 8 chars)" autocomplete="new-password" required minlength="8">
        <input class="input" id="confirm_password" type="password" placeholder="Confirm password" autocomplete="new-password" required minlength="8">
        <button type="submit" id="reg-btn" class="btn btn-primary btn-full">Create account</button>
      </form>

      <p id="switch-text" class="text-xs text-slate-500 mt-4 text-center">
        New here? <a class="link-sky" href="auth.html?mode=register" onclick="switchMode(event, 'register')">Create an account</a>
      </p>
    </div>

    <p class="text-11 text-slate-600 text-center mt-4">
      <a href="index.html" class="link-sky">&larr; Back to home</a>
    </p>
  </div>

  <script>
    function showError(msg) {
      var box = document.getElementById('err-box');
      if (!msg) {
        box.style.display = 'none';
        box.textContent = '';
        return;
      }
      box.textContent = msg;
      box.style.display = 'block';
    }

    function setMode(mode) {
      showError('');
      var isReg = mode === 'register';

      document.getElementById('login-form').style.display = isReg ? 'none' : 'block';
      document.getElementById('reg-form').style.display = isReg ? 'block' : 'none';

      document.getElementById('card-title').textContent = isReg
        ? 'Create your free account'
        : 'Log in to your account';
      document.getElementById('card-sub').textContent = isReg
        ? 'You will receive a virtual wallet with 10,000 VC.'
        : 'Use your username or email and password.';

      document.getElementById('switch-text').innerHTML = isReg
        ? 'Already registered? <a class="link-sky" href="auth.html?mode=login" onclick="switchMode(event, \'login\')">Log in</a>'
        : 'New here? <a class="link-sky" href="auth.html?mode=register" onclick="switchMode(event, \'register\')">Create an account</a>';

      document.title = (isReg ? 'Create account' : 'Log in') + ' · BATUA-Edu';

      var url = new URL(window.location.href);
      url.searchParams.set('mode', isReg ? 'register' : 'login');
      window.history.replaceState({}, '', url);
    }

    function switchMode(e, mode) {
      e.preventDefault();
      setMode(mode);
    }

    async function handleLogin(e) {
      e.preventDefault();
      showError('');
      var btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier: document.getElementById('login-id').value,
            password: document.getElementById('login-pw').value
          })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed.');

        localStorage.setItem('batua_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      showError('');

      var pw = document.getElementById('password').value;
      var cpw = document.getElementById('confirm_password').value;
      if (pw !== cpw) {
        return showError('Passwords do not match.');
      }

      var btn = document.getElementById('reg-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        var res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            first_name: document.getElementById('first_name').value,
            middle_name: document.getElementById('middle_name').value,
            last_name: document.getElementById('last_name').value,
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: pw
          })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed.');

        localStorage.setItem('batua_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    }

    var initialMode = new URLSearchParams(window.location.search).get('mode');
    setMode(initialMode === 'register' ? 'register' : 'login');
  </script>
</body>
</html>
